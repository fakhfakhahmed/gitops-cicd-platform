---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      # targetPort references the container port BY NAME, not by number.
      # Named ports mean the container can move from 8080 to 9090 by changing
      # one value, and the Service follows automatically. Hard-coding the
      # number here is how you end up with a Service that resolves, accepts
      # connections, and times out.
      targetPort: http
      protocol: TCP
      {{- with .Values.service.appProtocol }}
      # Read by service meshes and some ingress controllers to pick the right
      # protocol handling (HTTP/2 upgrades, L7 metrics, retry semantics).
      appProtocol: {{ . }}
      {{- end }}
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
  # The selector uses the MINIMAL label set. If it included the version label,
  # a rolling update would momentarily have no pods matching the selector and
  # the Service would black-hole traffic mid-deploy.
  selector:
    {{- include "app.selectorLabels" . | nindent 4 }}
