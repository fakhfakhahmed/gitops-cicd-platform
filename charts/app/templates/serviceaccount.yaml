{{- if .Values.serviceAccount.create -}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "app.serviceAccountName" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    # This is where cloud workload-identity bindings live, e.g.
    #   eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/app
    #   iam.gke.io/gcp-service-account: app@project.iam.gserviceaccount.com
    #   azure.workload.identity/client-id: <uuid>
    # That pattern - a short-lived, federated token minted per pod - is
    # strictly better than mounting a static cloud credential as a Secret.
    {{- toYaml . | nindent 4 }}
  {{- end }}

# automountServiceAccountToken is set in BOTH places on purpose:
#   * here, so any pod that ever references this ServiceAccount inherits the
#     safe default even if someone adds a Job or CronJob later and forgets;
#   * on the pod spec in deployment.yaml, because the pod-level setting is
#     what actually wins if the two ever disagree.
#
# Defence in depth costs one line. The token is a cluster credential; a
# workload that never calls the API server should not be carrying one around
# on disk for an attacker to find.
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
