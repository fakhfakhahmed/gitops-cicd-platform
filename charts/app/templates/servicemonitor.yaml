{{- if .Values.serviceMonitor.enabled -}}
---
# monitoring.coreos.com/v1 - a CRD installed by the Prometheus Operator
# (kube-prometheus-stack). It is NOT part of core Kubernetes.
#
# This whole file is behind `if .Values.serviceMonitor.enabled` for a specific
# operational reason: applying a ServiceMonitor to a cluster that does not have
# the CRD fails with
#
#   unable to recognize "": no matches for kind "ServiceMonitor" in version
#   "monitoring.coreos.com/v1"
#
# and in Argo CD that failure takes the ENTIRE Application OutOfSync /
# SyncFailed - not just this one resource. One optional monitoring object
# would block the Deployment from reconciling. Hence: off by default, on only
# in the environments that actually run the operator (prod, here).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    # The Prometheus Operator's `serviceMonitorSelector` decides which
    # ServiceMonitors a given Prometheus picks up. kube-prometheus-stack
    # defaults to selecting on `release: <helm-release-of-the-stack>`.
    #
    # Get this wrong and there is NO error anywhere: the ServiceMonitor is
    # created, `kubectl get servicemonitor` shows it, and Prometheus simply
    # never reads it. The target never appears in the Targets page. Always
    # verify in Prometheus -> Status -> Service Discovery, not in kubectl.
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  # selector/namespaceSelector describe which SERVICE this monitor scrapes.
  # Note it targets the Service, not the pods: the operator reads the
  # Service's EndpointSlices to find individual targets, which is how a
  # scrape automatically follows scale-up and scale-down.
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}

  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}

  endpoints:
    # `port` is the Service port NAME ("http"), not a number. Numbers are
    # rejected by the CRD schema.
    - port: http
      path: {{ .Values.serviceMonitor.path }}
      interval: {{ .Values.serviceMonitor.interval }}
      # scrapeTimeout must be <= interval, or the operator refuses the config
      # and silently drops this target from the generated scrape config.
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
      scheme: http
      # false means the scrape's own job/instance/namespace labels win over
      # any identically-named label the target exposes. Setting it true lets
      # a target lie about its own identity, which makes attribution in
      # dashboards unreliable.
      honorLabels: {{ .Values.serviceMonitor.honorLabels }}

      {{- with .Values.serviceMonitor.relabelings }}
      # relabelings run BEFORE the scrape: they rewrite the target's labels
      # and can drop targets entirely.
      relabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.serviceMonitor.metricRelabelings }}
      # metricRelabelings run AFTER the scrape, on each sample. This is the
      # right place to drop high-cardinality series before they are ingested -
      # the cheapest cardinality fix there is, because the data never reaches
      # the TSDB.
      metricRelabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
